[project]
name = "ecart-oat-bund"
version = "0.1.0"
description = "Écart OAT-Bund à 10 ans : la part propre à la France depuis mai 2024, et ce qu'elle coûte sous stress."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2024.2.2",
    "matplotlib>=3.10",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "statsmodels>=0.14.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecart_oat_bund"]

[tool.pytest.ini_options]
testpaths = ["tests"]
